# Local development stack.
#
# The backend needs a display for its browser automation, which is why it runs
# under Xvfb in the image. The session directory is a named volume: an
# ephemeral filesystem would wipe the linked WhatsApp session on every
# `docker compose up`, forcing a fresh phone-link handshake each time.

services:
  db:
    # Optional. SQLite is the default and is fine for a single user; Postgres
    # is what you want before more than a handful of people are sending,
    # because sends write from background threads while requests are served.
    # DATABASE_URL is not wired into settings.py yet — point DATABASE_PATH at a
    # mounted file, or add the Postgres backend, which is a deliberate change
    # rather than something to switch on by accident.
    image: postgres:16-alpine
    profiles: [with-postgres]
    environment:
      POSTGRES_PASSWORD: bulk-sender
      POSTGRES_DB: bulk_sender
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    # Optional. Without it the cache falls back to a local file, which is
    # shared between workers in one container but resets on restart. Set
    # REDIS_URL=redis://redis:6379/0 for limits that survive a restart.
    image: redis:7-alpine
    profiles: [with-redis]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      WHATSAPP_HEADLESS: "false"
      # Generate real ones; the development fallbacks are refused when
      # DEBUG=False.
      # SECRET_KEY: ...
      # CRYPTOGRAPHY_KEYS: ...
    volumes:
      # The linked WhatsApp session. Persistent, and the single most
      # important volume in this file.
      - whatsapp-sessions:/app/whatsapp_session
      - media:/app/media
      - whatsapp-debug:/app/whatsapp_debug
    # The image runs as a non-root user; the volumes are created root-owned by
    # Docker, so chown them once before first use:
    #   docker compose run --rm --entrypoint chown appuser:appuser /app/media ...
    healthcheck:
      # Same tolerance as the HEALTHCHECK baked into the image: a 401 is the
      # success signal here, not a failure. `/api/login-status/` requires auth,
      # so an unauthenticated probe always gets 401, and `curl -fsS` exits 22 on
      # any HTTP error. Without the `|| [ "$?" = "22" ]` fallback this reports
      # the container unhealthy forever while the app is serving perfectly.
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/login-status/ -o /dev/null || [ \"$?\" = \"22\" ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      # Empty means "same origin": the dev server proxies /api to the backend
      # container, so no CORS configuration is needed for local work.
      VITE_API_BASE_URL: ""
      VITE_DEV_API_TARGET: "http://backend:8000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  whatsapp-sessions:
  media:
  whatsapp-debug:
  postgres-data:
  frontend-node-modules:
