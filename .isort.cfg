[settings]
# Mirrored in .pre-commit-config.yaml. Keep the two in step.
profile = black
line_length = 110

# Without this, isort treats `sender` and `config` as third-party and strips
# the blank line that separates them from django/rest_framework — rewriting the
# first-party boundary out of every file in the project.
known_first_party = sender,config

# Keeps `from django.db.models import Count as _Count, Q as _Q` on one line
# instead of splitting each aliased import.
combine_as_imports = True

skip = migrations,.git,__pycache__,venv,.venv,node_modules